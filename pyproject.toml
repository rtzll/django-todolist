[project]
name = "django-todolist"
version = "0.1.0"
description = "Django Todo List application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.1",
    "djangorestframework>=3.18.0",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
